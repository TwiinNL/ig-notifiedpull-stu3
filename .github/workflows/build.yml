name: Build IG

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      # Pinned: the errors check below depends on the qa.json layout of this version.
      PUBLISHER_VERSION: 3.0.0
      PUBLISHER_SHA256: b8403abe5a438ddb9a3a07e02ad925f2c4bbbd9e903c49ecff50fcb481ec64ad
      # Jekyll comes from the locked Gemfile; the publisher calls `jekyll` from the PATH.
      BUNDLE_GEMFILE: ${{ github.workspace }}/.github/jekyll/Gemfile
      JEKYLL_NO_BUNDLER_REQUIRE: '1'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      # Installs the gems of .github/jekyll/Gemfile.lock and caches them on the lock file.
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      # The publisher runs `jekyll` from the PATH; the wrapper makes that run the locked gems.
      - name: Put Jekyll on the PATH
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          {
            echo '#!/usr/bin/env bash'
            echo 'exec bundle exec jekyll "$@"'
          } > "$RUNNER_TEMP/bin/jekyll"
          chmod +x "$RUNNER_TEMP/bin/jekyll"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/bin/jekyll" --version

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      # The key of the package cache holds what decides which packages a build needs: the template
      # (ig.ini, and the version and sha-256 of its release asset), the dependencies (not the rest
      # of the IG definition, so a title edit keeps the cache), the pinned publisher, the install
      # scripts with their checksums and
      # .github/fhir-packages.lock, the list of every package a build ends up with. No
      # restore-keys: a partial match could restore packages of another dependency set.
      - name: Compute package cache key
        id: pkgkey
        run: |
          echo "deps=$({
            grep -E '^template' ig.ini
            grep -E '^(version|sha)=' .github/scripts/install-template.sh
            python3 -I -c 'import json,sys; d=json.load(open(sys.argv[1])); print(d["fhirVersion"], json.dumps(d.get("dependsOn"), sort_keys=True))' \
              input/ImplementationGuide-nl.twiin.fhir.stu3.notifiedpull.json
          } | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"

      # The jars are only a download cache: every run still checks their sha-256 below, also
      # when they come from the cache.
      - name: Cache tool jars
        uses: actions/cache@v6
        with:
          path: |
            input-cache/publisher.jar
          key: jars-${{ runner.os }}-publisher-${{ env.PUBLISHER_VERSION }}-${{ env.PUBLISHER_SHA256 }}

      # Saved at the end of a successful job only, so after the package set check below.
      - name: Cache FHIR packages
        uses: actions/cache@v6
        with:
          path: ~/.fhir/packages
          key: fhir-packages-${{ runner.os }}-${{ env.PUBLISHER_VERSION }}-${{ env.PUBLISHER_SHA256 }}-${{ steps.pkgkey.outputs.deps }}-${{ hashFiles('.github/fhir-packages.lock', '.github/scripts/install-*.sh') }}

      - name: Download IG Publisher
        run: |
          mkdir -p input-cache
          if [ ! -f input-cache/publisher.jar ]; then
            curl -sSfL -o input-cache/publisher.jar \
              "https://github.com/HL7/fhir-ig-publisher/releases/download/${PUBLISHER_VERSION}/publisher.jar"
          fi
          echo "${PUBLISHER_SHA256}  input-cache/publisher.jar" | shasum -a 256 -c -

      # Not in the package cache of the registry: the template is the asset of a release of
      # TwiinNL/ig-template. Always installed from a fresh download with its sha-256 checked, so
      # a restored cache entry is replaced, not trusted.
      - name: Install twiin.base.template
        run: .github/scripts/install-template.sh

      - name: Build IG
        run: java -jar input-cache/publisher.jar -ig .

      - name: Upload build output
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ig-output
          path: output/
          if-no-files-found: warn

      # The redirect script comes from twiin.base.template; fail if the redirect does not work.
      - name: Test language redirect
        run: node test/lang-redirects.test.js

      # The header comes from twiin.base.template; fail if the release label is missing.
      - name: Test release label
        run: node test/release-label.test.js

      # Parsing of the Publication Request row of qa.html in check-qa.py; needs no build.
      - name: Test QA check
        run: python3 test/check-qa.test.py

      # The publisher exits with 0 even when qa.html reports errors, so check the
      # errors ourselves: every error in output/qa.xml and output/qa.txt must be listed
      # in known-errors.txt, and so must every error and warning of the Publication Request (only in
      # qa.html).
      - name: Fail on unknown errors in QA report
        run: python3 .github/scripts/check-qa.py

      # Last step, so that a failed job never saves its packages to the cache.
      - name: Check package set against lock file
        run: .github/scripts/check-package-set.sh
